[project]
name = "gridcast-de"
version = "1.0.0"
description = "Probabilistic day-ahead forecasting of German electricity grid load, benchmarked against the official TSO forecast."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Yousef Abdelmegeed" }]
dependencies = [
    "fastapi>=0.115",
    "holidays>=0.60",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
train = ["matplotlib>=3.9", "mlflow>=2.16", "optuna>=4.0"]
dev = ["mypy>=1.11", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML"]

[project.scripts]
gridcast = "gridcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: needs live SMARD / Open-Meteo access (deselected in CI)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/gridcast"]
